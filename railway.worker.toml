# Page Watch worker: a second Railway service built from this same repo.
# The web service reads railway.toml. Railway no longer lets a new service
# opt in to a config file (Config-as-code is deprecated; since 2026-08-28 the
# path is dropped when saved), so these settings are entered by hand on the
# worker's Settings page: Custom Start Command, no Healthcheck Path, Restart
# Policy, Draining Seconds. This file records them and the tests check them.
# Steps: docs/page-watch-plan.md, "Setting up the worker on Railway".
[build]
builder = "RAILPACK"

[deploy]
startCommand = "python -m tracker.watch_worker"
# No web port, so no HTTP health check: the website's
# /strategic-agents/page-watch/health shows the worker's heartbeat.
restartPolicyType = "ALWAYS"
# On a deploy, running checks get this long to finish after SIGTERM; the
# worker hands back what is left (tracker/watch_worker.py, GRACE_S).
drainingSeconds = 75
