name: Buyer Radar daily search

# Every hour, asks the live site to look after Buyer Radar's daily searches (app.py buyer_radar_daily):
# it starts each workspace's search in the hour before its time (Settings, India time), tries a failed
# one once more, and posts each finished search's Slack message when its time comes. A late or skipped
# call is made up by the next one. The site does the work and keeps to each workspace's run and monthly
# caps; this only calls it. The reply holds counts only.
#
# Needs the repository secret BUYER_RADAR_CRON_TOKEN (the same value as the Railway variable on the web
# service). Until it is set this exits quietly, so nothing runs or spends before it is switched on.
# The site address defaults to the custom domain; set the repository variable APP_URL to change it.

on:
  workflow_dispatch:
  schedule:
    # Minute 31 UTC is one minute past the hour in India (UTC+5:30), so a 9:00 Slack time is met at
    # about 9:01. GitHub can start a scheduled run some minutes late; the next hour's call catches up.
    - cron: '31 * * * *'

permissions: {}

concurrency:
  group: buyer-radar-daily
  cancel-in-progress: false

jobs:
  start:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ask the site
        env:
          TOKEN: ${{ secrets.BUYER_RADAR_CRON_TOKEN }}
          APP_URL: ${{ vars.APP_URL || 'https://northaxis.outcomes.digital' }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::notice::BUYER_RADAR_CRON_TOKEN is not set yet, so the daily search is off (Settings > Secrets and variables > Actions)."
            exit 0
          fi
          code=$(curl -sS -o reply.json -w '%{http_code}' --max-time 110 \
                      --retry 2 --retry-delay 20 --retry-all-errors \
                      -X POST -H "Authorization: Bearer $TOKEN" "$APP_URL/api/buyer-radar/daily") || code=000
          echo "HTTP $code"
          cat reply.json 2>/dev/null; echo
          if [ "$code" != "200" ]; then
            echo "::error::The daily search could not start (HTTP $code)."
            exit 1
          fi
