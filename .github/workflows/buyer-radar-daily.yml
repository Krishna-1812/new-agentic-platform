name: Buyer Radar daily search

# Each morning, asks the live site to start one Buyer Radar search (LinkedIn posts from people asking
# for what we sell) for every workspace that switched its daily search on in Settings. The site does
# the work and keeps to each workspace's run and monthly caps (app.py buyer_radar_daily); this only
# calls it. The reply holds counts only.
#
# Needs the repository secret BUYER_RADAR_CRON_TOKEN (the same value as the Railway variable on the web
# service). Until it is set this exits quietly, so nothing runs or spends before it is switched on.
# The site address defaults to the custom domain; set the repository variable APP_URL to change it.

on:
  workflow_dispatch:
  schedule:
    # 01:17 UTC = 06:47 India time: yesterday's posts are in, and the leads are waiting at the start
    # of the day. Off the hour, when GitHub's scheduled runs start latest.
    - cron: '17 1 * * *'

permissions: {}

concurrency:
  group: buyer-radar-daily
  cancel-in-progress: false

jobs:
  start:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ask the site
        env:
          TOKEN: ${{ secrets.BUYER_RADAR_CRON_TOKEN }}
          APP_URL: ${{ vars.APP_URL || 'https://northaxis.outcomes.digital' }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::notice::BUYER_RADAR_CRON_TOKEN is not set yet, so the daily search is off (Settings > Secrets and variables > Actions)."
            exit 0
          fi
          code=$(curl -sS -o reply.json -w '%{http_code}' --max-time 60 \
                      --retry 2 --retry-delay 20 --retry-all-errors \
                      -X POST -H "Authorization: Bearer $TOKEN" "$APP_URL/api/buyer-radar/daily") || code=000
          echo "HTTP $code"
          cat reply.json 2>/dev/null; echo
          if [ "$code" != "200" ]; then
            echo "::error::The daily search could not start (HTTP $code)."
            exit 1
          fi
