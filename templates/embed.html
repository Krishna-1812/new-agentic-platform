{% from "_bento.html" import head, topbar, topbar_script with context %}
<!DOCTYPE html>
<html lang="en">
<head>
{{ head(title, ["embed.css?v=1"], compat=True) }}
</head>
<body>

{{ topbar([(brand.agents_plural, "/strategic-agents"), (title, none)]) }}
  <div class="topbar-accent"></div>

  <!-- Iframe -->
  <div class="iframe-wrap">
    <div class="iframe-loader" id="loader">
      <div class="spinner"></div>
      <div class="loader-text">Loading {{ title }}…</div>
    </div>
    <iframe
      src="{{ embed_url }}"
      id="embed-frame"
      allow="clipboard-write; fullscreen">
    </iframe>
  </div>

  <script>
    function toggleMenu() {
      var pill=document.getElementById('userPill'), dd=document.getElementById('userDropdown');
      pill.classList.toggle('open',!dd.classList.contains('open')); dd.classList.toggle('open');
    }
    document.addEventListener('click',function(e){ var m=document.getElementById('userMenu'); if(m&&!m.contains(e.target)){document.getElementById('userPill').classList.remove('open');document.getElementById('userDropdown').classList.remove('open');} });
    document.addEventListener('keydown',function(e){ if(e.key==='Escape'){document.getElementById('userPill').classList.remove('open');document.getElementById('userDropdown').classList.remove('open');} });
    // Hide loader 1s after iframe load fires — gives the app time to render inside
    document.getElementById('embed-frame').addEventListener('load', function() {
      setTimeout(function() {
        document.getElementById('loader').classList.add('hidden');
      }, 1000);
    });

    (function(){
      var _start = Date.now(), _sent = false;
      function _send(){
        if(_sent) return; _sent = true;
        fetch('/api/track', {method:'POST', headers:{'Content-Type':'application/json'},
          body: JSON.stringify({page: window.location.pathname, title: '{{ title }}',
          seconds: Math.round((Date.now()-_start)/1000),
          email: '{{ user.email if user else "" }}'}), keepalive: true}).catch(function(){});
      }
      document.addEventListener('visibilitychange', function(){ if(document.visibilityState==='hidden') _send(); });
      window.addEventListener('beforeunload', _send);
    })();

    /* Keep the address bar + breadcrumb in sync with the embedded tool.
       The tool lives in a cross-origin iframe, so we can't read its URL — the
       SEO app posts a {source:'p2-seo-tool', type:'route-change', tool, name}
       message on every navigation (see seo-apps' RouteBridge). We reflect that
       into /seo-aeo/<slug> via pushState so the URL always names the current
       agent and the browser's back/forward works across agents. */
    (function(){
      var frame = document.getElementById('embed-frame');
      var expectedOrigin = '';
      try { expectedOrigin = new URL(frame.src, location.href).origin; } catch(e){}
      window.addEventListener('message', function(e){
        if(expectedOrigin && e.origin !== expectedOrigin) return;
        var d = e.data;
        if(!d || d.source !== 'p2-seo-tool' || d.type !== 'route-change' || !d.tool) return;
        var target = '/seo-aeo/' + d.tool;
        if(location.pathname === target) return;
        history.pushState({seoTool:d.tool}, '', target);
        var cur = document.querySelector('.bc-cur');
        if(cur && d.name) cur.textContent = d.name;
        if(d.name) document.title = d.name + ' — Platform';
      });
      /* On back/forward the parent URL changes but the cross-origin iframe
         won't follow on its own, so reload to let the server render the tool
         that the (now-current) URL points at. */
      window.addEventListener('popstate', function(){
        if(/^\/seo-aeo\/[^/]+/.test(location.pathname)) window.location.reload();
      });
    })();
  </script>
<script>(function(){try{var p=location.pathname;document.querySelectorAll('a.dd-item[href],a.tb-dd-item[href]').forEach(function(a){if(a.getAttribute('href')===p){a.classList.add('active');a.style.background='rgba(255,96,34,.18)';a.style.color='#fff';}});}catch(e){}})();</script>
{{ topbar_script() }}
</body>
</html>
