<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Access restricted · {{ brand.product }}</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#F1EFED">
<link rel="icon" type="image/svg+xml" href="/static/favicon.svg?v=7">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght,SOFT,WONK@0,9..144,300..900,0..100,0..1;1,9..144,300..900,0..100,0..1&family=Zalando+Sans:ital,wght@0,300..900;1,300..900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/bento-tokens.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/bento-components.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/workspace.css') }}?v=1">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/client-portal.css') }}?v=4">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/bento-compat.css') }}">
</head>
<body style="--brand:{{ client.accent }}; --brand2:{{ client.accent2 }}">
  <div class="denied">
    <div class="denied-card">
      <div class="mk"><span class="bn-mark"></span><span class="bn-word">{{ brand.name }}</span></div>
      <h1>This workspace is private</h1>
      <p>The {{ client.name }} workspace is limited to {{ client.name }} and {{ brand.name }} accounts. Your account doesn't have access.</p>
      {% if user %}<span class="who">Signed in as {{ user.email }}</span>{% endif %}
      <div class="acts">
        <a class="btn-primary" style="--ac:{{ client.accent }};--ac2:{{ client.accent2 }};font-size:14px;padding:12px 20px" href="/logout">Sign in with a different account</a>
        <a class="btn-ghost" href="/">Go to {{ brand.short }}</a>
      </div>
    </div>
  </div>
</body>
</html>
