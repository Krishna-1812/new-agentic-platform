<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- The product mark (.bn-mark in bento-components.css): a lime square on
       the product's ink. The ink tile is what keeps it visible on a light
       browser tab, where lime alone is about 1.3:1 against white. No name in
       here on purpose, so renaming the brand never touches this file. -->
  <rect width="64" height="64" rx="14" fill="#131315"/>
  <rect x="18" y="18" width="28" height="28" rx="7" fill="#C6F24E"/>
</svg>
